<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>
</head>
<body>
  <header>
    <h1>QuickNotes</h1>
    <p class="subtitle">A simple notes client backed by a REST API</p>
  </header>

  <main>
    <section class="controls">
      <button id="load-btn" type="button">Load notes</button>
      <p id="status" role="status" aria-live="polite"></p>
    </section>

    <section class="create">
      <h2>Create a note</h2>
      <form id="note-form" novalidate>
        <div class="field">
          <label for="title-input">Title <span class="required">(required, max 100 characters)</span></label>
          <input
            id="title-input"
            name="title"
            type="text"
            maxlength="100"
            placeholder="Note title"
            autocomplete="off"
          >
        </div>

        <div class="field">
          <label for="body-input">Body <span class="optional">(optional)</span></label>
          <textarea
            id="body-input"
            name="body"
            rows="4"
            placeholder="Write your note here..."
          ></textarea>
        </div>

        <button id="submit-btn" type="submit">Create note</button>
      </form>
    </section>

    <section class="notes">
      <h2>Notes</h2>
      <ul id="notes-list"></ul>
    </section>
  </main>
</body>
</html>
